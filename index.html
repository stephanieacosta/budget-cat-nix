/* ---------- ajustes ---------- */
function openSet(){
  $("set").innerHTML=`<h3>${t("settings")}</h3>
  <div class="set"><span>${t("lang")}</span><select class="sel" id="sl"><option value="es" ${S.lang==="es"?"selected":""}>Español</option><option value="en" ${S.lang==="en"?"selected":""}>English</option></select></div>
  <div class="set"><span>${t("currency")}</span><select class="sel" id="sc">${CURS.map(c=>`<option ${c===S.cur?"selected":""}>${c}</option>`).join("")}</select></div>
  ${budEdit?`<div class="set"><span>${t("budgetM")}</span><span style="display:flex;gap:6px;align-items:center"><input class="inp2" id="bin" inputmode="decimal" autocomplete="off" value="${S.budget?fmtAmt(String(S.budget).replace(".",DC())):""}" placeholder="0" style="width:120px;padding:8px 10px"><button class="lnk" id="bsv">${t("save")}</button><button class="lnk" id="bcn" style="color:var(--mu)">${t("cancel")}</button></span></div>`
  :`<div class="set"><span>${t("budgetM")}</span><button class="lnk" id="sb">${S.budget?money(S.budget):t("set")}</button></div>`}
  <div class="set"><span>${t("carry")}</span><input type="checkbox" id="sy" ${S.carry?"checked":""}></div>
  ${catSec("g",t("catsG"))}
  ${catSec("i",t("catsI"))}
  <div class="set" style="border:0;margin-top:6px"><b>${t("backup")}</b></div><div class="set" style="justify-content:space-around"><button class="lnk" id="bx">${t("exp")}</button><button class="lnk" id="bi">${t("imp")}</button></div>
  <button class="lnk" id="so" style="margin-top:12px;width:100%">${t("close")}</button>`;
  if(!$("set").open)$("set").showModal();
}
$("set").onclick=e=>{
  const x=e.target,g=k=>x.closest("["+k+"]")?.getAttribute(k);let v;
  if(x===$("set")||x.id==="so"){budEdit=false;delCatId=null;return $("set").close()}
  if(x.id==="bx"){exportData();return}
  if(x.id==="bi"){openBk("i");return}
  if(x.id==="sb"){budEdit=true;openSet();setTimeout(()=>{const i=$("bin");if(i)i.focus()},50);return}
  if(x.id==="bcn"){budEdit=false;openSet();return}
  if(x.id==="bsv"){const n=parseAmt($("bin").value);S.budget=n>0?n:0;budEdit=false}
  else if(x.id==="sn-g"||x.id==="sn-i"){openCat(x.id.slice(3),null,()=>openSet());return}
  else if((v=g("data-kc"))){const c=S.cats.find(y=>y.id===+v);c.k=((c.k||0)+1)%PAL.length}
  else if((v=g("data-dc"))){if(!canDel(+v))return;delCatId=+v;openSet();return}
  else if(x.closest("[data-cx]")){delCatId=null;openSet();return}
  else if((v=g("data-cy"))){doDel(+v);delCatId=null;save();render();openSet();flash(t("deleted"));return}
  else if((v=g("data-ec"))){openCat(null,+v,()=>openSet());return}
  else return;
  save();render();openSet();
};
$("set").oninput=e=>{if(e.target.id==="bin")e.target.value=fmtAmt(e.target.value)};
$("set").onchange=e=>{
  if(e.target.id==="sl"){S.lang=e.target.value;applyStatic();renderDel()}
  else if(e.target.id==="sc")S.cur=e.target.value;
  else if(e.target.id==="sy")S.carry=e.target.checked;
  else return;
  save();render();openSet();
};
$("set").addEventListener("close",()=>{budEdit=false;delCatId=null});
applyStatic();renderDel();render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
</html>
