<!DOCTYPE html>
<html lang="es" data-skin="plain">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>budget</title>

<meta name="description" content="Control de gastos e ingresos">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="budget">

<link rel="manifest" href="/manifest.webmanifest">
<!-- El SVG es el icono de la pestaña; el PNG queda de reserva para
     navegadores que no lo admitan. iOS solo acepta PNG en su icono. -->
<link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg">
<link rel="icon" type="image/png" href="/src/assets/icon-192.png">
<link rel="apple-touch-icon" href="/src/assets/apple-touch-icon.png">

<!-- Tipografías: Playfair para el logo clásico, Quicksand y Baloo para el tema gatitos -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@600;700&display=swap">

<link rel="stylesheet" href="/src/styles/base.css">
<link rel="stylesheet" href="/src/styles/theme-cats.css">
</head>

<body>

<!-- ===========================================================
     Esta página está casi vacía a propósito.
     <main> lo rellena src/app/render.js en cada cambio; los
     diálogos de abajo los rellena cada feature al abrirlos.
     =========================================================== -->

<main id="m"></main>

<!-- Degradado que difumina el contenido bajo la barra de navegación -->
<div class="fade"></div>

<!-- Barra inferior: tres pestañas y el botón de añadir -->
<nav class="nav">
  <div class="np" id="np">
    <button data-t="home">
      <svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true">
        <path d="M12 2.8 2.4 11h2.8v9.2h5.1v-5.6h3.4v5.6h5.1V11h2.8z" fill="currentColor"/>
      </svg>
    </button>
    <button data-t="list">
      <svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true">
        <g fill="currentColor">
          <circle cx="4" cy="6.5" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="4" cy="17.5" r="1.5"/>
        </g>
        <path d="M9 6.5h11M9 12h11M9 17.5h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>
    <button data-t="stats">
      <svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true">
        <path d="M10.6 13.4V3A9.5 9.5 0 1 0 21 13.4z" fill="currentColor"/>
        <path d="M13.4 10.6V2.9A9.5 9.5 0 0 1 21.1 10.6z" fill="currentColor"/>
      </svg>
    </button>
  </div>
  <button class="np2" id="plus">+</button>
</nav>

<!-- Panel de añadir / editar un movimiento. Oculto hasta que se le pone la clase "on" -->
<div id="add">
  <div class="ac">
    <div class="hd">
      <span class="bdg" id="bd">0</span>
      <span id="hdv">0</span>
      <button class="ico" id="cl">✕</button>
    </div>

    <div class="big">
      <div class="av" id="av">•</div>
      <small id="dl"></small>
      <input class="amt" id="amt" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
      <input class="nt" id="nt" maxlength="40">
      <div class="seg" id="tp">
        <button data-k="g" class="on"></button>
        <button data-k="i"></button>
      </div>
      <input class="dt" id="dt" type="date">
    </div>

    <button class="btn" id="svb" style="display:none"></button>
    <div id="delw" style="display:none"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Selector de archivo, oculto: lo abre el diálogo de importar -->
<input type="file" id="bf" accept=".json,application/json" hidden>

<!-- Diálogos. Vacíos: cada módulo escribe su contenido al abrirlos -->
<dialog id="set"></dialog>   <!-- ajustes -->
<dialog id="ncd"></dialog>   <!-- categoría -->
<dialog id="bk"></dialog>    <!-- respaldo -->
<dialog id="per"></dialog>   <!-- selector de periodo -->

<!-- Aviso flotante. Es un popover para que se vea por encima de los diálogos -->
<div id="toast" popover="manual"></div>

<script type="module" src="/src/app/main.js"></script>
</body>
</html>
